apiVersion: v1
kind: Pod
metadata:
  name: taint-demo-without-toleration
  namespace: default
  labels:
    app: taint-demo-without-toleration
spec:
  nodeSelector:
    workload-tier: critical
  containers:
    - name: app
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: taint-demo-with-toleration
  namespace: default
  labels:
    app: taint-demo-with-toleration
spec:
  nodeSelector:
    workload-tier: critical
  tolerations:
    - key: critical-only
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: app
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi