apiVersion: apps/v1
kind: Deployment
metadata:
  name: spot-batch
  namespace: default
spec:
  replicas: 8
  selector:
    matchLabels:
      app: spot-batch
  template:
    metadata:
      labels:
        app: spot-batch
    spec:
      nodeSelector:
        capacity-tier: spot
        kubernetes.io/arch: arm64
      tolerations:
      - key: spot-only
        operator: Equal
        value: 'true'
        effect: NoSchedule
      containers:
      - name: worker
        image: busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
        - sh
        - -c
        - sleep 3600
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
