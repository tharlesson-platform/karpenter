apiVersion: apps/v1
kind: Deployment
metadata:
  name: spot-batch
  namespace: default
spec:
  replicas: 8
  selector:
    matchLabels:
      app: spot-batch
  template:
    metadata:
      labels:
        app: spot-batch
    spec:
      nodeSelector:
        capacity-tier: spot
        kubernetes.io/arch: arm64
      tolerations:
        - key: spot-only
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: worker
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi