serviceAccount:
  create: true
  name: karpenter

settings:
  batchMaxDuration: 10s
  batchIdleDuration: 1s

replicas: 2

controller:
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  nodeSelector:
    workload-tier: core
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: karpenter
  podDisruptionBudget:
    maxUnavailable: 1

webhook:
  enabled: true

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack

logLevel: info