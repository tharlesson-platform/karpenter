apiVersion: v1
kind: Pod
metadata:
  name: taint-demo-without-toleration
  namespace: default
  labels:
    app: taint-demo-without-toleration
spec:
  nodeSelector:
    workload-tier: critical
  containers:
  - name: app
    image: busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command:
    - sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
---
apiVersion: v1
kind: Pod
metadata:
  name: taint-demo-with-toleration
  namespace: default
  labels:
    app: taint-demo-with-toleration
spec:
  nodeSelector:
    workload-tier: critical
  tolerations:
  - key: critical-only
    operator: Equal
    value: 'true'
    effect: NoSchedule
  containers:
  - name: app
    image: busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command:
    - sh
    - -c
    - sleep 3600
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
